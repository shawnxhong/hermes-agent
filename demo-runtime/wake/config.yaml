# Restart aisp-wake after editing. No image rebuild is needed for mounted config.
# ASR hints and command matching are independent. Matching uses the shared Feishu grammar.
asr:
  hotwords:
    - Hello Intel
    - Hi Intel
    - Hey Intel
    - Intel Intel
    - stop playback
    - stop music
    - stop video
    - stop audio
    - stop media
    - stop player
    - close video
    - close player
    - turn off music
    - turn off video
wake:
  aliases:
    - Hello Intel
    - Hi Intel
    - Hi Indel
    - High Intel
    - Hi Inter
    - Hello Inter
    - Hello Indel
    - Hey Intel
    - Hey Inter
    - Hey Indel
    - Intel Intel

media_stop:
  enabled: true
  # Literal words, not regular expressions. Matches a full command, not a substring.
  # Example: "Could you stop the music please?" (verb=stop, target=music).
  match:
    verbs:
      - stop
      - close
      - quit
      - turn off
    targets:
      - music
      - audio
      - video
      - videos
      - song
      - songs
      - media
      - playback
      - player
